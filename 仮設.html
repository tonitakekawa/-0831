<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮設 — sandstorm</title>
<style>
  body {
    margin: 0;
    max-width: none;
    padding: 0;
    background: #000;
    font-family: serif;
  }
  .layout {
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
  }
  .left-pane {
    width: 140px;
    flex-shrink: 0;
    padding: 50px 20px 50px 30px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid #e6e6e6;
    box-sizing: border-box;
  }
  .left-pane ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .left-pane li {
    margin: 0.8em 0;
  }
  .left-pane a {
    text-decoration: none;
    color: #aaa;
  }
  .left-pane a:hover {
    text-decoration: underline;
  }
  .right-pane {
    flex: 1;
    max-width: 36em;
    padding: 50px;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }
  #sandstorm {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .controls label {
    font-size: 11px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls input[type=range] {
    width: 80px;
  }
  @media (max-width: 600px) {
    .layout { flex-direction: column; }
    .left-pane {
      width: 100%;
      height: auto;
      position: static;
      border-right: none;
      border-bottom: 1px solid #e6e6e6;
      padding: 20px;
    }
    .left-pane ul { display: flex; gap: 1.5em; }
    .right-pane { padding: 20px; }
  }
</style>
</head>
<body>

<canvas id="sandstorm"></canvas>

<div class="layout">
  <nav class="left-pane">
    <ul>
      <li><a href="#">top</a></li>
      <li><a href="#">出来事</a></li>
      <li><a href="#">好き</a></li>
      <li><a href="#">制作</a></li>
    </ul>
  </nav>
  <main class="right-pane">
    <p>仮設テキスト。砂嵐の強度・方向・密度をスライダーで調整できます。</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore.</p>
  </main>
</div>

<script>
(() => {
  const canvas = document.getElementById('sandstorm');
  const ctx = canvas.getContext('2d');

  let W, H;
  const resize = () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  };
  window.addEventListener('resize', resize);
  resize();

  // sin アニメーションの基底パラメータ（中心値）
  const base = {
    count:   3000,
    speed:   4,
    angle:   10,
    opacity: 20,
  };

  // 各パラメータを揺らす sin の設定：振幅・周期（秒）・位相オフセット（rad）
  const waves = {
    count:   { amp: 1800, period: 37, phase: 0 },
    speed:   { amp: 2.5, period: 23, phase: 1.3 },
    angle:   { amp: 18,  period: 53, phase: 2.7 },
    opacity: { amp: 10,  period: 17, phase: 4.1 },
  };

  let particles = [];
  let lastCount = base.count;

  const rand = (a, b) => a + Math.random() * (b - a);

  const makeParticle = () => ({
    x: rand(-W * 0.1, W * 1.1),
    y: rand(0, H),
    size:  rand(0.5, 2.2),
    speed: rand(0.6, 1.4),
    drift: rand(-0.3, 0.3),
    alpha: rand(0.3, 1.0),
    len:   rand(3, 14),
    frozenUntil: 0,
    freezeChance: rand(0.0005, 0.003), // フレームごとに止まる確率（粒子ごとに異なる）
  });

  const setCount = n => {
    n = Math.round(n);
    if (n > particles.length) {
      while (particles.length < n) particles.push(makeParticle());
    } else {
      particles.length = n;
    }
  };

  particles = Array.from({ length: base.count }, makeParticle);

  const sin = (t, w) => Math.sin(t / w.period * Math.PI * 2 + w.phase);

  const tick = t => {
    const ts = t / 1000;

    const count   = base.count   + sin(ts, waves.count)   * waves.count.amp;
    const speed   = base.speed   + sin(ts, waves.speed)   * waves.speed.amp;
    const angle   = base.angle   + sin(ts, waves.angle)   * waves.angle.amp;
    const opacity = base.opacity + sin(ts, waves.opacity) * waves.opacity.amp;

    setCount(count);

    ctx.clearRect(0, 0, W, H);

    const rad = angle * Math.PI / 180;
    const vx = Math.cos(rad) * speed;
    const vy = Math.sin(rad) * speed;
    const baseAlpha = Math.max(0.02, opacity / 100);

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = baseAlpha * p.alpha;
      ctx.strokeStyle = `hsl(130, 80%, 45%)`;
      ctx.lineWidth = p.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - vx * p.len * 0.3, p.y - vy * p.len * 0.3);
      ctx.stroke();
      ctx.restore();

      if (t < p.frozenUntil) continue;
      if (Math.random() < p.freezeChance) { p.frozenUntil = t + 500; continue; }

      p.x += vx * p.speed;
      p.y += vy * p.speed + p.drift;

      if (p.x > W * 1.1 || p.y > H * 1.1 || p.y < -H * 0.1) {
        Object.assign(p, makeParticle());
        p.x = rand(-W * 0.1, 0);
        p.y = rand(0, H);
      }
    }

    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
