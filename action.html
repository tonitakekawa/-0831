  </main>
</div>

<script>
(() => {
  const canvas = document.getElementById('sandstorm');
  const ctx = canvas.getContext('2d');
  let W, H;
  const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
  window.addEventListener('resize', resize);
  resize();

  const rand  = (a, b) => a + Math.random() * (b - a);
  const sinW  = (ts, w) => Math.sin(ts / w.period * Math.PI * 2 + w.phase);

  // ── Mode A ──────────────────────────────────────────────────────────────────
  const modeA = (() => {
    const base  = { count: 1500, speed: 4, angle: 10, opacity: 20 };
    const waves = {
      count:   { amp: 0,    period: 37, phase: 0   },
      speed:   { amp: 2.5,  period: 23, phase: 1.3 },
      angle:   { amp: 18,   period: 53, phase: 2.7 },
      opacity: { amp: 10,   period: 17, phase: 4.1 },
    };
    const HUES = [0, 130, 220];
    const make = () => ({
      x: rand(-W*0.1, W*1.1), y: rand(0, H),
      size: rand(5, 22), speed: rand(0.6, 1.4),
      drift: rand(-0.3, 0.3), alpha: rand(0.3, 1.0),
      len: rand(3, 14), frozenUntil: 0,
      freezeChance: rand(0.0005, 0.003),
      ci: Math.floor(Math.random() * 3),
    });
    let ps = [];
    const setN = n => {
      n = Math.round(n);
      if (n > ps.length) while (ps.length < n) ps.push(make());
      else ps.length = n;
    };
    return {
      getPositions() { return ps.map(p => ({ x: p.x, y: p.y, ci: p.ci, size: p.size })); },
      seedFrom(src) { ps = src.map(({x, y, ci, size}) => Object.assign(make(), {x, y, ci, size})); },
      init() { ps = Array.from({ length: base.count }, make); },
      tick(t, ts, alpha) {
        const count   = base.count   + sinW(ts, waves.count)   * waves.count.amp;
        const speed   = base.speed   + sinW(ts, waves.speed)   * waves.speed.amp;
        const angle   = base.angle   + sinW(ts, waves.angle)   * waves.angle.amp;
        const opacity = base.opacity + sinW(ts, waves.opacity) * waves.opacity.amp;
        setN(count);
        const rad = angle * Math.PI / 180;
        const vx = Math.cos(rad) * speed, vy = Math.sin(rad) * speed;
        const ba = Math.max(0.02, opacity / 100) * alpha;
        for (const p of ps) {
          ctx.save();
          ctx.globalAlpha = ba * p.alpha;
          ctx.strokeStyle = `hsl(${HUES[p.ci]},80%,48%)`;
          ctx.lineWidth = p.size; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - vx * p.len * 0.3, p.y - vy * p.len * 0.3);
          ctx.stroke(); ctx.restore();
          if (t < p.frozenUntil) continue;
          if (Math.random() < p.freezeChance) { p.frozenUntil = t + 500; continue; }
          p.x += vx * p.speed; p.y += vy * p.speed + p.drift;
          if (p.x > W*1.1 || p.y > H*1.1 || p.y < -H*0.1) {
            Object.assign(p, make()); p.x = rand(-W*0.1, 0); p.y = rand(0, H);
          }
        }
      },
    };
  })();

  // ── Mode B ──────────────────────────────────────────────────────────────────
  const modeB = (() => {
    const HUES = [0, 130, 220];
    const FR_SCALE = [1.6, 1.0, 0.55];
    const N = 1500;
    const make = () => {
      const ci = Math.floor(Math.random() * 3);
      return {
        x: rand(0, W), y: rand(0, H), ci,
        alpha: rand(0.4, 1.0), size: rand(10, 32), amp: rand(1.2, 3.8),
        ph: [rand(0,Math.PI*2), rand(0,Math.PI*2), rand(0,Math.PI*2), rand(0,Math.PI*2)],
        fr: [rand(0.4, 1.1)*FR_SCALE[ci], rand(0.6, 1.4)*FR_SCALE[ci]],
        frozenUntil: 0, freezeChance: rand(0.002, 0.008),
      };
    };
    let ps = [];
    return {
      getPositions() { return ps.map(p => ({ x: p.x, y: p.y, ci: p.ci, size: p.size })); },
      seedFrom(src) { ps = src.map(({x, y, ci, size}) => Object.assign(make(), {x, y, ci, size})); },
      init() { ps = Array.from({ length: N }, make); },
      tick(t, ts, alpha) {
        for (const p of ps) {
          const vx = p.amp * Math.sin(ts*p.fr[0]+p.ph[0]) * Math.cos(ts*p.fr[1]*0.7+p.ph[1]);
          const vy = p.amp * Math.cos(ts*p.fr[0]*0.9+p.ph[2]) * Math.sin(ts*p.fr[1]+p.ph[3]);
          ctx.save();
          ctx.globalAlpha = alpha * p.alpha;
          ctx.fillStyle = `hsl(${HUES[p.ci]},80%,52%)`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
          ctx.restore();
          if (t < p.frozenUntil) continue;
          if (Math.random() < p.freezeChance) { p.frozenUntil = t + 500; continue; }
          p.x += vx; p.y += vy;
          if (p.x < 0) p.x += W; else if (p.x > W) p.x -= W;
          if (p.y < 0) p.y += H; else if (p.y > H) p.y -= H;
        }
      },
    };
  })();

  // ── Mode C ──────────────────────────────────────────────────────────────────
  const modeC = (() => {
    const RING_DEFS = [{ hue: 0 }, { hue: 130 }, { hue: 220 }];
    const PER_RING = 500;
    const makeP = () => ({
      theta: rand(0, Math.PI*2), r: 1 + rand(-0.12, 0.12),
      rV: rand(-0.0008, 0.0008),
      speed: rand(0.003, 0.009) * (Math.random() < 0.5 ? 1 : -1),
      alpha: rand(0.35, 1.0), size: rand(12, 28),
      frozenUntil: 0, freezeChance: rand(0.0002, 0.001),
    });
    let rings = [], globalRot = 0;
    const centers = () => {
      const D = Math.min(W, H) * 0.17;
      return [0,1,2].map(ri => {
        const a = (ri/3)*Math.PI*2 - Math.PI/2 + globalRot;
        return { cx: W/2 + Math.cos(a)*D, cy: H/2 + Math.sin(a)*D };
      });
    };
    return {
      getState() { return { rings, globalRot }; },
      getPositions() {
        const R = Math.min(W, H) * 0.26;
        const cs = centers();
        const out = [];
        for (let ri = 0; ri < 3; ri++) {
          const {cx, cy} = cs[ri];
          for (const p of rings[ri].ps)
            out.push({ x: cx + Math.cos(p.theta)*R*p.r, y: cy + Math.sin(p.theta)*R*p.r, ci: ri, size: p.size });
        }
        return out;
      },
      seedFrom(src) {
        // convert x/y positions → ring-local polar coords
        const R = Math.min(W, H) * 0.26;
        globalRot = 0;
        const cs = centers();
        rings = RING_DEFS.map((d, ri) => {
          const {cx, cy} = cs[ri];
          const pool = src.filter(p => p.ci === ri);
          while (pool.length < PER_RING)
            pool.push({ x: cx + rand(-R*0.5, R*0.5), y: cy + rand(-R*0.5, R*0.5), ci: ri });
          return {
            ...d,
            ps: pool.slice(0, PER_RING).map(({x, y, size}) => {
              const dx = x-cx, dy = y-cy, dist = Math.sqrt(dx*dx+dy*dy);
              return Object.assign(makeP(), {
                theta: Math.atan2(dy, dx),
                r: dist > 0 ? Math.min(1.4, Math.max(0.6, dist/R)) : 1,
                ...(size != null ? { size } : {}),
              });
            }),
          };
        });
      },
      init() {
        rings = RING_DEFS.map(d => ({ ...d, ps: Array.from({ length: PER_RING }, makeP) }));
        globalRot = 0;
      },
      tick(t, ts, alpha) {
        globalRot += 0.00025 + 0.00015 * Math.sin(ts/47);
        const R = Math.min(W, H) * 0.26;
        const baseOp = (0.22 + 0.1*Math.sin(ts/31)) * alpha;
        const cs = centers();
        for (let ri = 0; ri < 3; ri++) {
          const ring = rings[ri], {cx, cy} = cs[ri];
          for (const p of ring.ps) {
            const px = cx + Math.cos(p.theta)*R*p.r;
            const py = cy + Math.sin(p.theta)*R*p.r;
            ctx.save();
            ctx.globalAlpha = baseOp * p.alpha;
            ctx.fillStyle = `hsl(${ring.hue},75%,55%)`;
            ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            if (t < p.frozenUntil) continue;
            if (Math.random() < p.freezeChance) { p.frozenUntil = t + 500; continue; }
            p.theta += p.speed;
            p.r += p.rV;
            if (p.r < 0.75 || p.r > 1.25) p.rV *= -1;
          }
        }
      },
    };
  })();

  // ── Mode AB ─────────────────────────────────────────────────────────────────
  const modeAB = (() => {
    const HUES = [0, 130, 220]; const N = 1500;
    let ps = [], startTs = null;
    const make = () => ({
      x: rand(-W*0.1,W*1.1), y: rand(0,H), ci: Math.floor(Math.random()*3),
      size: rand(8,25), speed: rand(0.5,1.4), drift: rand(-0.8,0.8),
      alpha: rand(0.3,1.0), len: rand(2,10), ph: rand(0,Math.PI*2),
      frozenUntil: 0, freezeChance: rand(0.001,0.005),
    });
    return {
      getPositions() { return ps.map(p => ({ x: p.x, y: p.y, ci: p.ci, size: p.size })); },
      seedFrom(src) { ps = src.map(({x, y, ci, size}) => Object.assign(make(), {x, y, ci, size})); startTs = null; },
      init() { ps = Array.from({length:N}, make); startTs = null; },
      tick(t, ts, alpha) {
        if (startTs===null) startTs=ts;
        const prog = Math.min(1,(ts-startTs)/5);
        const baseAngle = 10 + prog*160*Math.sin(ts*1.5+0.5);
        const baseSpeed = 4*(1-prog*0.65);
        const rad=baseAngle*Math.PI/180;
        const vxB=Math.cos(rad)*baseSpeed, vyB=Math.sin(rad)*baseSpeed;
        for (const p of ps) {
          const ca=prog*3;
          const vx=vxB+ca*Math.sin(ts*1.1+p.ph), vy=vyB+ca*Math.cos(ts*0.8+p.ph);
          ctx.save(); ctx.globalAlpha=alpha*p.alpha;
          ctx.strokeStyle=`hsl(${HUES[p.ci]},80%,48%)`; ctx.lineWidth=p.size; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-vx*p.len*0.3,p.y-vy*p.len*0.3);
          ctx.stroke(); ctx.restore();
          if (t<p.frozenUntil) continue;
          if (Math.random()<p.freezeChance){p.frozenUntil=t+500;continue;}
          p.x+=vx*p.speed; p.y+=vy*p.speed+p.drift*(1+prog);
          if (p.x>W*1.2||p.x<-W*0.2||p.y>H*1.2||p.y<-H*0.2){Object.assign(p,make());p.x=rand(-W*0.1,0);p.y=rand(0,H);}
        }
      },
    };
  })();

  // ── Mode BC ─────────────────────────────────────────────────────────────────
  const modeBC = (() => {
    const HUES=[0,130,220], FR_SCALE=[1.6,1.0,0.55];
    const ATT=[[-0.2,-0.12],[0.2,-0.12],[0.0,0.18]];
    const N=1500; let ps=[], startTs=null;
    const make = () => { const ci=Math.floor(Math.random()*3); return {
      x:rand(0,W),y:rand(0,H),ci,alpha:rand(0.4,1.0),size:rand(1.0,3.2),amp:rand(1.2,3.8),
      ph:[rand(0,Math.PI*2),rand(0,Math.PI*2),rand(0,Math.PI*2),rand(0,Math.PI*2)],
      fr:[rand(0.4,1.1)*FR_SCALE[ci],rand(0.6,1.4)*FR_SCALE[ci]],
      frozenUntil:0,freezeChance:rand(0.002,0.006),
    };};
    return {
      getPositions() { return ps.map(p => ({ x: p.x, y: p.y, ci: p.ci, size: p.size })); },
      seedFrom(src) { ps = src.map(({x, y, ci, size}) => Object.assign(make(), {x, y, ci, size})); startTs = null; },
      init() { ps=Array.from({length:N},make); startTs=null; },
      tick(t,ts,alpha) {
        if (startTs===null) startTs=ts;
        const prog=Math.min(1,(ts-startTs)/5), att=prog*prog*0.07;
        for (const p of ps) {
          const sc=1-prog*0.75;
          const vx=p.amp*sc*Math.sin(ts*p.fr[0]+p.ph[0])*Math.cos(ts*p.fr[1]*0.7+p.ph[1]);
          const vy=p.amp*sc*Math.cos(ts*p.fr[0]*0.9+p.ph[2])*Math.sin(ts*p.fr[1]+p.ph[3]);
          const ax=(W/2+ATT[p.ci][0]*W-p.x)*att, ay=(H/2+ATT[p.ci][1]*H-p.y)*att;
          ctx.save(); ctx.globalAlpha=alpha*p.alpha;
          ctx.fillStyle=`hsl(${HUES[p.ci]},80%,52%)`;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
          if (t<p.frozenUntil) continue;
          if (Math.random()<p.freezeChance){p.frozenUntil=t+500;continue;}
          p.x+=vx+ax; p.y+=vy+ay;
          if (p.x<0) p.x+=W; else if (p.x>W) p.x-=W;
          if (p.y<0) p.y+=H; else if (p.y>H) p.y-=H;
        }
      },
    };
  })();

  // ── Mode CA ─────────────────────────────────────────────────────────────────
  const modeCA = (() => {
    const RING_DEFS=[{hue:0},{hue:130},{hue:220}], PER_RING=500;
    const makeP=()=>({theta:rand(0,Math.PI*2),r:1+rand(-0.12,0.12),
      speed:rand(0.003,0.009)*(Math.random()<0.5?1:-1),
      alpha:rand(0.35,1.0),size:rand(1.2,2.8),frozenUntil:0,freezeChance:rand(0.0002,0.001)});
    let rings=[],startTs=null,globalRot=0;
    return {
      seedFrom({ rings: srcRings, globalRot: srcRot }) {
        rings = srcRings.map(ring => ({ ...ring, ps: ring.ps.map(p => ({ ...p })) }));
        globalRot = srcRot;
        startTs = null;
      },
      init() { rings=RING_DEFS.map(d=>({...d,ps:Array.from({length:PER_RING},makeP)})); startTs=null; globalRot=0; },
      tick(t,ts,alpha) {
        if (startTs===null) startTs=ts;
        const prog=Math.min(1,(ts-startTs)/5);
        globalRot+=0.00025+prog*0.003;
        const D=Math.min(W,H)*0.17, R=Math.min(W,H)*(0.26+prog*0.22);
        const baseOp=(0.22+0.1*Math.sin(ts/31))*alpha*(1-prog*0.6);
        for (let ri=0;ri<3;ri++) {
          const ring=rings[ri], ca=(ri/3)*Math.PI*2-Math.PI/2+globalRot;
          const cx=W/2+Math.cos(ca)*D, cy=H/2+Math.sin(ca)*D;
          for (const p of ring.ps) {
            const px=cx+Math.cos(p.theta)*R*p.r, py=cy+Math.sin(p.theta)*R*p.r;
            ctx.save(); ctx.globalAlpha=baseOp*p.alpha;
            ctx.fillStyle=`hsl(${ring.hue},75%,55%)`;
            ctx.beginPath(); ctx.arc(px,py,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
            if (t<p.frozenUntil) continue;
            if (Math.random()<p.freezeChance){p.frozenUntil=t+500;continue;}
            p.theta+=p.speed*(1+prog*5);
          }
        }
      },
    };
  })();

  const SCHEDULE = [
    { key: 'A',  dur: 25000 },
    { key: 'AB', dur:  5000 },
    { key: 'B',  dur: 25000 },
    { key: 'BC', dur:  5000 },
    { key: 'C',  dur: 25000 },
    { key: 'CA', dur:  5000 },
  ];
  const TOTAL_DUR = SCHEDULE.reduce((s,m)=>s+m.dur,0);
  const CUM = (()=>{ let a=0; return SCHEDULE.map(m=>{const c=a;a+=m.dur;return c;}); })();
  const MODE_MAP = { A:modeA, AB:modeAB, B:modeB, BC:modeBC, C:modeC, CA:modeCA };

  Object.values(MODE_MAP).forEach(m => m.init());

  let startTime = null, prevKey = null;

  const tick = t => {
    if (startTime===null) startTime=t;
    const elapsed=t-startTime, ts=t/1000;
    const cycleTime=elapsed%TOTAL_DUR;
    let si=0;
    for (let i=SCHEDULE.length-1;i>=0;i--) { if (cycleTime>=CUM[i]){si=i;break;} }
    const entry=SCHEDULE[si], timeInMode=cycleTime-CUM[si];
    window._fsmState={ key:entry.key, timeInMode, dur:entry.dur };

    if (entry.key !== prevKey) {
      const prev = prevKey ? MODE_MAP[prevKey] : null;
      const cur  = MODE_MAP[entry.key];
      if      (entry.key === 'CA' && prev?.getState)
        cur.seedFrom(prev.getState());
      else if (prev?.getPositions && cur.seedFrom)
        cur.seedFrom(prev.getPositions());
      else
        cur.init();
      prevKey = entry.key;
    }

    ctx.clearRect(0,0,W,H);
    MODE_MAP[entry.key].tick(t,ts,1);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

// FSM 図の更新
(() => {
  const CIRC=2*Math.PI*23, MAIN=['A','B','C'];
  const els={};
  for (const k of MAIN) els[k]={arc:document.getElementById(`parc-${k}`),node:document.getElementById(`fnode-${k}`),lbl:document.getElementById(`flbl-${k}`)};
  const arrs={AB:document.getElementById('farr-AB'),BC:document.getElementById('farr-BC'),CA:document.getElementById('farr-CA')};
  const update=()=>{
    const s=window._fsmState;
    if (s) {
      const prog=Math.min(1,s.timeInMode/s.dur), isTrans=s.key.length>1;
      for (const k of MAIN){els[k].arc.setAttribute('stroke-dasharray',`0 ${CIRC}`);els[k].node.setAttribute('stroke','#383838');els[k].node.setAttribute('stroke-width','1.5');els[k].lbl.setAttribute('fill','#484848');}
      for (const arr of Object.values(arrs)){arr.setAttribute('stroke','#333');arr.setAttribute('stroke-width','1.2');}
      if (isTrans){const arr=arrs[s.key];if(arr){arr.setAttribute('stroke','hsl(130,65%,42%)');arr.setAttribute('stroke-width','2.5');}}
      else{els[s.key].arc.setAttribute('stroke-dasharray',`${prog*CIRC} ${CIRC}`);els[s.key].node.setAttribute('stroke','hsl(130,65%,42%)');els[s.key].node.setAttribute('stroke-width','2');els[s.key].lbl.setAttribute('fill','#aaa');}
    }
    requestAnimationFrame(update);
  };
  requestAnimationFrame(update);
})();
</script>
<style>

    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #aporia-bg.visible {
    opacity: 1;
  }
</style>

<div id="aporia-bg"></div>

<script>
(() => {
  const links = document.querySelectorAll('.tab-link');
  links.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const target = link.dataset.target;
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      links.forEach(l => l.classList.remove('active'));
      document.getElementById(target).classList.add('active');
      link.classList.add('active');
    });
  });
})();

(() => {
  // 各キーに対応する画像
  // 'a' は最初(0)と最後(1)で別の絵にできる
  const images = {
    'a': ['a.jpg', 'a2.jpg'],  // 1回目, 2回目
    'p': ['p.jpg'],
    'o': ['o.jpg'],
    'r': ['r.jpg'],
    'i': ['i.jpg'],
  };

  const aporia = ['a', 'p', 'o', 'r', 'i', 'a'];
  let position = 0;  // aporia のどこまで進んだか

  const bg = document.getElementById('aporia-bg');
  let timer = null;

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    const key = e.key.toLowerCase();
    if (!images[key]) return;

    // 'a' キーが押された場合、aporia の現在位置に応じて絵を選ぶ
    let imagePath;
    if (key === 'a') {
      // aporia の文脈を追跡
      if (aporia[position] === 'a') {
        imagePath = images['a'][position === 0 ? 0 : 1];
        position = position === 0 ? 1 : 0;  // 次の 'a' へ、または先頭に戻る
      } else {
        // 文脈から外れた a が来た→リセットして1枚目
        imagePath = images['a'][0];
        position = 1;
      }
    } else {
      imagePath = images[key][0];
      // aporia の文脈を進める
      if (aporia[position] === key) {
        position++;
      } else {
        position = 0;
      }
    }

    bg.style.backgroundImage = `url('${imagePath}')`;
    bg.classList.add('visible');

    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      bg.classList.remove('visible');
    }, 3000);
  });
})();
</script>
